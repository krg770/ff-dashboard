<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy Football Command Center</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #0f1115;
    color: #e4e6eb;
    font-size: 13px;
  }
  header {
    padding: 12px 20px;
    background: #1a1d24;
    border-bottom: 1px solid #2a2e37;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .latest-update {
    background: #171a21;
    border-bottom: 1px solid #262a33;
    padding: 10px 20px;
  }
  .latest-update-summary { font-size: 12px; color: #9099a8; }
  .latest-update-summary strong { color: #e4e6eb; }
  .injury-alert-header {
    font-size: 11px;
    color: #f87171;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 6px;
    margin-bottom: 4px;
  }
  .injury-alert-header.clickable { cursor: pointer; user-select: none; }
  .injury-alert-header.clickable:hover { color: #fca5a5; }
  .injury-alert-row { font-size: 12px; margin-bottom: 6px; }
  .injury-alert-row strong { color: #e4e6eb; }
  .injury-alert-meta { font-size: 10px; color: #6b7280; margin-top: 1px; }
  .injury-alert-row.clickable { cursor: pointer; border-radius: 4px; padding: 3px 6px; margin: 0 -6px 6px; }
  .injury-alert-row.clickable:hover { background: #1c2029; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; background: #14161c; border-bottom: 1px solid #2a2e37; }
  .tab {
    padding: 10px 16px;
    cursor: pointer;
    color: #9099a8;
    border-bottom: 2px solid transparent;
    font-weight: 500;
  }
  .tab.active { color: #fff; border-bottom-color: #4f8cff; }
  main { padding: 16px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-full { grid-column: 1 / -1; }
  section {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9099a8;
    padding: 10px 12px;
    margin: 0;
    border-bottom: 1px solid #262a33;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 6px 10px;
    font-size: 11px;
    text-transform: uppercase;
    color: #6b7280;
    border-bottom: 1px solid #262a33;
  }
  td { padding: 6px 10px; border-bottom: 1px solid #1e2129; vertical-align: top; }
  tr:hover td { background: #1c2029; }
  .empty-state { padding: 24px 12px; text-align: center; color: #6b7280; font-style: italic; }
  .badge { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .rising { background: #1a3a2a; color: #4ade80; }
  .falling { background: #3a1a1a; color: #f87171; }
  .neutral { background: #2a2d35; color: #9ca3af; }
  .mixed { background: #3a3218; color: #fbbf24; }
  .tag { display: inline-block; background: #262a33; color: #9099a8; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 3px; }
  .tag.tag-injury { background: #3a1a1a; color: #f87171; font-weight: 600; }
  .tag.tag-injury_beneficiary { background: #1a3a2a; color: #4ade80; }
  .confidence-low { color: #fbbf24; font-size: 10px; }
  .fantasy-relevance { color: #6b7280; font-size: 11px; margin-top: 2px; }
  .source-cell { font-size: 11px; color: #9099a8; white-space: nowrap; }
  .source-date { color: #6b7280; }
  .section-updated { font-size: 10px; color: #6b7280; font-weight: 400; text-transform: none; letter-spacing: normal; white-space: nowrap; }
  .new-badge { display: inline-block; background: #1e3a5f; color: #60a5fa; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-right: 4px; letter-spacing: 0.5px; vertical-align: middle; }
  .buzz-callout { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
  .buzz-callout-item { font-size: 12px; }
  .buzz-callout-item.rising strong { color: #4ade80; }
  .buzz-callout-item.falling strong { color: #f87171; }
  .buzz-callout-item.clickable { cursor: pointer; border-radius: 4px; padding: 2px 6px; margin: -2px -6px; }
  .buzz-callout-item.clickable:hover { background: #1c2029; }
  .pipeline-status-bar { padding: 6px 20px; font-size: 11px; background: #14161c; border-bottom: 1px solid #2a2e37; color: #9099a8; }
  .pipeline-status-bar.running { color: #60a5fa; }
  .pipeline-status-bar strong { color: #e4e6eb; }
  .pipeline-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #60a5fa; margin-right: 6px; animation: pipeline-pulse 1.5s infinite; }
  @keyframes pipeline-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .news-group-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #1c2029;
    border-top: 1px solid #262a33; border-bottom: 1px solid #262a33;
    font-size: 12.5px; font-weight: 600;
  }
  .news-group-player { color: #e4e6eb; }
  .news-group:first-child .news-group-header { border-top: none; }
  .news-group-header.clickable { cursor: pointer; justify-content: space-between; user-select: none; }
  .news-group-header.clickable:hover { background: #22262f; }
  .collapse-arrow { display: inline-block; width: 12px; color: #6b7280; }
  .round-count { font-size: 10px; color: #6b7280; font-weight: 400; }
  .player-search { position: relative; }
  .player-search input {
    background: #1e2129; color: #e4e6eb; border: 1px solid #2a2e37;
    border-radius: 4px; padding: 5px 10px; font-size: 12px; width: 200px;
  }
  .player-search input:focus { outline: none; border-color: #4f8cff; }
  .player-search-dropdown {
    position: absolute; top: calc(100% + 4px); right: 0; width: 280px;
    background: #1a1d24; border: 1px solid #2a2e37; border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; max-height: 320px; overflow-y: auto;
  }
  .player-search-result { padding: 8px 12px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #262a33; }
  .player-search-result:last-child { border-bottom: none; }
  .player-search-result:hover { background: #22262f; }
  .player-panel-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; z-index: 200; overflow-y: auto;
  }
  .player-panel {
    position: relative; background: #171a21; border: 1px solid #262a33; border-radius: 8px;
    padding: 24px; width: 100%; max-width: 760px; max-height: calc(100vh - 80px); overflow-y: auto;
  }
  .player-panel-close {
    position: absolute; top: 14px; right: 14px; background: none; border: none;
    color: #6b7280; font-size: 16px; cursor: pointer; padding: 4px 8px;
  }
  .player-panel-close:hover { color: #e4e6eb; }
  .dev-toggle {
    background: none; border: 1px solid #2a2e37; color: #6b7280; font-size: 11px;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .dev-toggle:hover { color: #e4e6eb; border-color: #4f8cff; }
  .dev-panel {
    background: #0b0d11; border-bottom: 1px solid #2a2e37; padding: 10px 20px;
    font-size: 11px; color: #9099a8; font-family: "Consolas", "SF Mono", monospace;
  }
  .dev-panel-row { margin-bottom: 3px; }
  .dev-panel-row strong { color: #e4e6eb; font-weight: 600; }
  .dev-panel-table { width: auto; margin-top: 4px; font-size: 10.5px; }
  .dev-panel-table th, .dev-panel-table td { padding: 3px 10px 3px 0; border: none; color: #9099a8; }
  .dev-panel-table th { color: #6b7280; text-transform: none; }
  .value-movers { display: flex; gap: 20px; padding: 4px 12px 14px; flex-wrap: wrap; }
  .value-movers-col { flex: 1; min-width: 240px; }
  .value-movers-title { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .value-movers-title.rising { color: #4ade80; }
  .value-movers-title.falling { color: #f87171; }
  .value-movers-row { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #1e2129; }
  .experimental-banner {
    background: #2a2210; border: 1px solid #4a3a10; color: #fbbf24;
    padding: 8px 12px; border-radius: 4px; font-size: 12px; margin-bottom: 12px;
  }
  select, input {
    background: #1e2129; color: #e4e6eb; border: 1px solid #2a2e37;
    border-radius: 4px; padding: 4px 8px; font-size: 12px;
  }
  .quote-cell { max-width: 400px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API = "";

function useApi(path, deps = [], refreshMs = null) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!path) { setData(null); setLoading(false); return; }
    let cancelled = false;
    function load() {
      fetch(API + path)
        .then(r => r.json())
        .then(d => { if (!cancelled) { setData(d); setLoading(false); } })
        .catch(() => { if (!cancelled) { setData([]); setLoading(false); } });
    }
    setLoading(true);
    load();
    const interval = refreshMs ? setInterval(load, refreshMs) : null;
    return () => { cancelled = true; if (interval) clearInterval(interval); };
  }, deps);
  return [data, loading];
}

function EmptyState({ text }) {
  return <div className="empty-state">{text || "Waiting on season data"}</div>;
}

const NEW_WINDOW_HOURS = 24;

function timeAgo(dateStr) {
  if (!dateStr) return null;
  const diffMs = Date.now() - new Date(dateStr).getTime();
  if (diffMs < 0) return "just now";
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  return `${days}d ago`;
}

function isNew(dateStr) {
  if (!dateStr) return false;
  const diffMs = Date.now() - new Date(dateStr).getTime();
  return diffMs >= 0 && diffMs < NEW_WINDOW_HOURS * 3600 * 1000;
}

function latestTimestamp(rows, getters) {
  let max = null;
  for (const row of rows || []) {
    for (const get of getters) {
      const v = get(row);
      if (v && (!max || v > max)) max = v;
    }
  }
  return max;
}

function SectionUpdated({ timestamp }) {
  if (!timestamp) return null;
  return <span className="section-updated">Updated {timeAgo(timestamp)}</span>;
}

function NewBadge({ timestamp }) {
  if (!isNew(timestamp)) return null;
  return <span className="new-badge">NEW</span>;
}

function BuzzBadge({ podcastCount, risingCount, fallingCount }) {
  if (!podcastCount) return <span style={{color: "#4b5060"}}>—</span>;
  let cls = "neutral";
  if (risingCount > fallingCount) cls = "rising";
  else if (fallingCount > risingCount) cls = "falling";
  else if (risingCount > 0 && fallingCount > 0) cls = "mixed";
  const label = podcastCount === 1 ? "1 show" : `${podcastCount} shows`;
  return <span className={"badge " + cls}>{label}</span>;
}

function groupNewsByPlayer(data) {
  const groups = new Map();
  const unmatched = [];
  for (const q of data) {
    if (!q.full_name) { unmatched.push(q); continue; }
    if (!groups.has(q.full_name)) groups.set(q.full_name, []);
    groups.get(q.full_name).push(q);
  }
  const grouped = Array.from(groups.entries()).map(([name, quotes]) => {
    const podcastCount = new Set(quotes.map(q => q.source_podcast).filter(Boolean)).size;
    const risingCount = quotes.filter(q => q.sentiment === "rising").length;
    const fallingCount = quotes.filter(q => q.sentiment === "falling").length;
    const latest = latestTimestamp(quotes, [q => q.created_at]);
    return { name, quotes, podcastCount, risingCount, fallingCount, latest };
  });
  grouped.sort((a, b) => b.podcastCount - a.podcastCount || (b.latest || "").localeCompare(a.latest || ""));
  return { grouped, unmatched };
}

function SentimentBadge({ sentiment }) {
  if (!sentiment) return null;
  return <span className={"badge " + sentiment}>{sentiment}</span>;
}

function Tags({ tags }) {
  if (!tags || !tags.length) return null;
  return tags.map((t, i) => (
    <span key={i} className={"tag tag-" + t}>{t === "injury_beneficiary" ? "injury beneficiary" : t}</span>
  ));
}

function LatestUpdate({ onSelectPlayer }) {
  const [data, loading] = useApi("/api/latest_run", []);
  const [injuryOpen, setInjuryOpen] = useState(false);
  if (loading || !data || !data.episodes || data.episodes.length === 0) return null;

  const quotes = data.quotes || [];
  const injuryQuotes = quotes.filter(q => q.tags && q.tags.includes("injury"));
  const mostRecent = data.episodes[0];
  const processedTime = mostRecent.processed_at
    ? new Date(mostRecent.processed_at).toLocaleString()
    : "";

  return (
    <div className="latest-update">
      <div className="latest-update-summary">
        Latest update: {processedTime} — {data.episodes.length} episode(s) processed,{" "}
        {quotes.length} quote(s) found
        {mostRecent && <> — most recent: <strong>{mostRecent.title}</strong></>}
      </div>
      {(data.top_riser || data.top_faller) && (
        <div className="buzz-callout">
          {data.top_riser && (
            <span
              className={"buzz-callout-item rising" + (data.top_riser.player_id ? " clickable" : "")}
              onClick={() => data.top_riser.player_id && onSelectPlayer(data.top_riser.player_id)}
            >
              🔺 Most talked-about riser: <strong>{data.top_riser.full_name}</strong> ({data.top_riser.mention_count} mentions this run) {data.top_riser.player_id && "→"}
            </span>
          )}
          {data.top_faller && (
            <span
              className={"buzz-callout-item falling" + (data.top_faller.player_id ? " clickable" : "")}
              onClick={() => data.top_faller.player_id && onSelectPlayer(data.top_faller.player_id)}
            >
              🔻 Most talked-about faller: <strong>{data.top_faller.full_name}</strong> ({data.top_faller.mention_count} mentions this run) {data.top_faller.player_id && "→"}
            </span>
          )}
        </div>
      )}
      {injuryQuotes.length > 0 && (
        <div>
          <div className="injury-alert-header clickable" onClick={() => setInjuryOpen(o => !o)}>
            <span className="collapse-arrow">{injuryOpen ? "▾" : "▸"}</span> ⚠ NEW INJURY NEWS ({injuryQuotes.length})
          </div>
          {injuryOpen && injuryQuotes.map((q, i) => (
            <div
              key={i}
              className={"injury-alert-row" + (q.player_id ? " clickable" : "")}
              onClick={() => q.player_id && onSelectPlayer(q.player_id)}
            >
              <strong>{q.full_name || "Unmatched player"}{q.player_id && " →"}:</strong> {q.quote_text}
              {q.fantasy_relevance && <div className="fantasy-relevance">{q.fantasy_relevance}</div>}
              <div className="injury-alert-meta">
                {q.source_podcast && <>{q.source_podcast} — </>}
                {q.source_published_at && <>aired {new Date(q.source_published_at).toLocaleDateString()} — </>}
                {q.created_at && <>reported {timeAgo(q.created_at)}</>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function formatDuration(seconds) {
  if (seconds == null || seconds < 0 || !isFinite(seconds)) return null;
  const mins = Math.round(seconds / 60);
  if (mins < 1) return "<1m";
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h ${mins % 60}m`;
}

function PipelineStatusBar() {
  const [data, loading] = useApi("/api/pipeline_status", [], 15000);
  if (loading || !data) return null;

  if (data.is_running) {
    const remaining = data.episodes_remaining_this_run;
    const eta = (remaining > 0 && data.avg_seconds_per_episode)
      ? formatDuration(remaining * data.avg_seconds_per_episode)
      : null;
    const stageLabel = { loading_model: "loading model", downloading: "downloading", transcribing: "transcribing", extracting: "extracting quotes" }[data.stage] || data.stage;
    return (
      <div className="pipeline-status-bar running">
        <span className="pipeline-dot" />
        Processing{data.current_episode_title && <>: <strong>{data.current_episode_title}</strong></>}
        {stageLabel && <> ({stageLabel})</>}
        {data.episodes_total_this_run && <> — episode {Math.min(data.episodes_done_this_run + 1, data.episodes_total_this_run)} of {data.episodes_total_this_run}</>}
        {eta && <> — ETA ~{eta}</>}
      </div>
    );
  }

  return (
    <div className="pipeline-status-bar">
      Pipeline idle
      {data.last_finished_at && <> — last run finished {timeAgo(data.last_finished_at)}</>}
      {data.last_poll_at && <> — feeds last checked {timeAgo(data.last_poll_at)} ({data.last_poll_new_count ?? 0} new found)</>}
      {data.episodes_queued_total > 0 && <> — <strong>{data.episodes_queued_total}</strong> episode(s) queued</>}
    </div>
  );
}

function DevPanel({ open }) {
  const [data, loading] = useApi("/api/dev_status", [], open ? 10000 : null);
  if (!open) return null;
  if (loading || !data) return <div className="dev-panel">Loading dev status...</div>;

  const p = data.pipeline || {};
  return (
    <div className="dev-panel">
      <div className="dev-panel-row"><strong>Server time:</strong> {new Date(data.server_time).toLocaleString()}</div>
      <div className="dev-panel-row"><strong>Cron schedule:</strong> {data.cron_schedule}</div>
      <div className="dev-panel-row"><strong>Next scheduled run:</strong> {new Date(data.next_scheduled_run).toLocaleString()}</div>
      <div className="dev-panel-row"><strong>Pipeline running:</strong> {p.is_running ? `yes — ${p.current_episode_title || "?"} (${p.stage})` : "no"}</div>
      <div className="dev-panel-row"><strong>Last poll:</strong> {p.last_poll_at ? `${timeAgo(p.last_poll_at)} — ${p.last_poll_new_count ?? 0} new episode(s) found` : "never (since pipeline_status tracking was added)"}</div>
      <div className="dev-panel-row"><strong>Last run finished:</strong> {p.last_finished_at ? timeAgo(p.last_finished_at) : "n/a"}</div>
      <div className="dev-panel-row"><strong>Error episodes (all-time):</strong> {data.total_error_episodes}</div>
      <div className="dev-panel-row" style={{marginTop: 6}}><strong>Episodes by podcast/status:</strong></div>
      <table className="dev-panel-table">
        <thead><tr><th>Podcast</th><th>new</th><th>transcribed</th><th>extracted</th><th>error</th><th>skipped</th></tr></thead>
        <tbody>
          {data.podcasts.map((pod, i) => (
            <tr key={i}>
              <td>{pod.name}</td>
              <td>{pod.counts.new || 0}</td>
              <td>{pod.counts.transcribed || 0}</td>
              <td>{pod.counts.extracted || 0}</td>
              <td>{pod.counts.error || 0}</td>
              <td>{pod.counts.skipped || 0}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function RoundFocus() {
  const [data, loading] = useApi("/api/round_focus?days=5", []);
  const [expanded, setExpanded] = useState(() => new Set(["RB"]));
  const updated = latestTimestamp(
    (data || []).flatMap(p => p.weekly_quotes || []),
    [q => q.created_at]
  );
  const byPosition = React.useMemo(() => {
    const map = new Map();
    for (const p of (data || [])) {
      if (!map.has(p.position)) map.set(p.position, []);
      map.get(p.position).push(p);
    }
    const known = POSITION_ORDER.filter(pos => map.has(pos)).map(pos => [pos, map.get(pos)]);
    const rest = Array.from(map.entries()).filter(([pos]) => !POSITION_ORDER.includes(pos));
    return known.concat(rest);
  }, [data]);

  const togglePosition = (pos) => {
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(pos)) next.delete(pos); else next.add(pos);
      return next;
    });
  };

  return (
    <section className="grid-full">
      <h2>
        <span>Player Buzz — by position, ADP order</span>
        <SectionUpdated timestamp={updated} />
      </h2>
      {loading ? <EmptyState text="Loading..." /> :
       (!data || data.length === 0) ? <EmptyState text="No players yet" /> :
      <div>
        {byPosition.map(([pos, players]) => {
          const isOpen = expanded.has(pos);
          return (
          <div className="news-group" key={pos}>
            <div className="news-group-header clickable" onClick={() => togglePosition(pos)}>
              <span className="news-group-player">
                <span className="collapse-arrow">{isOpen ? "▾" : "▸"}</span> {pos}
              </span>
              <span className="round-count">{players.length} players</span>
            </div>
            {isOpen &&
            <table>
              <thead><tr><th>Player</th><th>Team</th><th>ADP</th><th>Podcast Buzz — last 5 days</th></tr></thead>
              <tbody>
                {players.map((p, i) => (
                  <tr key={i}>
                    <td>{p.full_name}</td>
                    <td>{p.team}</td>
                    <td>{p.adp}</td>
                    <td className="quote-cell">
                      {p.weekly_quotes && p.weekly_quotes.length > 0 ? (
                        p.weekly_quotes.map((q, j) => (
                          <div key={j} style={{marginBottom: 4}}>
                            <SentimentBadge sentiment={q.sentiment} /> <NewBadge timestamp={q.created_at} /> {q.quote}
                          </div>
                        ))
                      ) : <span style={{color: "#6b7280"}}>No mentions in the last 5 days</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>}
          </div>
          );
        })}

function PayMeterBadge({ payMeter }) {
  const label = { pay_up: "PAY UP", pay_down: "PAY DOWN", pay_average: "PAY AVG" }[payMeter] || payMeter;

  return <span className={"badge " + cls}>{label}</span>;
}

const POSITION_ORDER = ["RB", "WR", "QB", "TE", "K", "DEF"];

function ValueMoversCallout({ players }) {
  const payUp = players.filter(p => p.pay_meter === "pay_up").sort((a, b) => b.auction_value - a.auction_value).slice(0, 8);
  const payDown = players.filter(p => p.pay_meter === "pay_down").sort((a, b) => b.auction_value - a.auction_value).slice(0, 8);
  if (payUp.length === 0 && payDown.length === 0) return null;

  return (
    <section className="grid-full">
      <h2><span>Value Movers</span></h2>
      <div style={{padding: "10px 12px", fontSize: 12, color: "#9099a8"}}>
        Highest-value players with a net rising or falling podcast-buzz signal this week — the sticker price below is ADP-derived and doesn't know about this yet.
      </div>
      <div className="value-movers">
        {payUp.length > 0 && (
          <div className="value-movers-col">
            <div className="value-movers-title rising">🔥 Bid above sticker — recent positive buzz</div>
            {payUp.map((p, i) => (
              <div key={i} className="value-movers-row"><strong>{p.full_name}</strong> ({p.position}) — ${p.auction_value}</div>
            ))}
          </div>
        )}
        {payDown.length > 0 && (
          <div className="value-movers-col">
            <div className="value-movers-title falling">❄️ Bargain watch — recent negative buzz</div>
            {payDown.map((p, i) => (
              <div key={i} className="value-movers-row"><strong>{p.full_name}</strong> ({p.position}) — ${p.auction_value}</div>

    </section>
  );
}

function SalaryTab() {
  const [resp, loading] = useApi("/api/salary", []);
  const [expanded, setExpanded] = useState(() => new Set(["RB"]));
  const players = resp ? resp.players : null;
  const updated = latestTimestamp(
    (players || []).flatMap(p => p.weekly_quotes || []),
    [q => q.created_at]
  );
  const positions = React.useMemo(() => {
    const map = new Map();
    for (const p of (players || [])) {
      if (!map.has(p.position)) map.set(p.position, []);
      map.get(p.position).push(p);
    }
    const known = POSITION_ORDER.filter(pos => map.has(pos)).map(pos => [pos, map.get(pos)]);
    const rest = Array.from(map.entries()).filter(([pos]) => !POSITION_ORDER.includes(pos));
    return known.concat(rest);
  }, [players]);

  const togglePosition = (pos) => {
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(pos)) next.delete(pos); else next.add(pos);
      return next;
    });

  return (

        real published auction prices — there's no data source for those
        wired up. Standard value-over-replacement math: every rostered
        player gets a $1 floor, the rest of a {resp ? `${resp.league_teams}-team, $${resp.league_budget}` : "10-team, $200"}-per-team
        pool splits by ADP rank on a decay curve. Treat as a reasonable
        starting estimate, not gospel.

      <section className="grid-full">

function InjuryReportSection() {
  const [days, setDays] = useState(3);
  const [resp, loading] = useApi(`/api/injury_report?days=${days}`, [days]);
  const [expanded, setExpanded] = useState(() => new Set());
  const quotes = resp ? resp.quotes : null;

  const byDay = React.useMemo(() => {
    const map = new Map();
    for (const q of (quotes || [])) {
      const day = q.report_date;
      if (!map.has(day)) map.set(day, []);
      map.get(day).push(q);
    }
    return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
  }, [quotes]);

  React.useEffect(() => {
    if (byDay.length > 0) setExpanded(new Set([byDay[0][0]]));
  }, [byDay.length]);

  const toggleDay = (day) => {
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(day)) next.delete(day); else next.add(day);
      return next;
    });
  };

  const formatDay = (dayStr) => {
    const d = new Date(dayStr + "T00:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((today - d) / 86400000);
    const label = diffDays === 0 ? "Today" : diffDays === 1 ? "Yesterday" : d.toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
    return label;
  };

  return (
    <section className="grid-full">
      <h2>
        <span>Injury Report — last {days} day{days === 1 ? "" : "s"}</span>
        <select value={days} onChange={e => setDays(Number(e.target.value))}>
          <option value={3}>3 days</option>
          <option value={7}>7 days</option>
          <option value={14}>14 days</option>
        </select>
      </h2>
      {loading ? <EmptyState text="Loading..." /> :
       byDay.length === 0 ? <EmptyState text="No injury-tagged quotes in this window" /> :
      <div>
        {byDay.map(([day, dayQuotes]) => {
          const isOpen = expanded.has(day);
          return (
          <div className="news-group" key={day}>
            <div className="news-group-header clickable" onClick={() => toggleDay(day)}>
              <span className="news-group-player">
                <span className="collapse-arrow">{isOpen ? "▾" : "▸"}</span> {formatDay(day)}
              </span>
              <span className="round-count">{dayQuotes.length} item{dayQuotes.length === 1 ? "" : "s"}</span>
            </div>
            {isOpen &&
            <table>
              <thead><tr><th>Player</th><th>Quote</th><th>Source</th></tr></thead>
              <tbody>
                {dayQuotes.map((q, i) => (
                  <tr key={i}>
                    <td>{q.full_name || <em style={{color:"#6b7280"}}>unmatched</em>}</td>
                    <td className="quote-cell">
                      <SentimentBadge sentiment={q.sentiment} /> {q.quote_text}
                      {q.fantasy_relevance && <div className="fantasy-relevance">{q.fantasy_relevance}</div>}
                    </td>
                    <td className="source-cell">
                      {q.source_podcast && <div>{q.source_podcast}</div>}
                      {q.source_published_at && <div className="source-date">Aired {new Date(q.source_published_at).toLocaleDateString()}</div>}
                    </td>
                  </tr>

              </tbody>
            </table>}
          </div>
          );
        })}

  );
}

      </div>

      <section className="grid-full">
        <h2><span>First to Cover This Week (real data)</span></h2>
        {loading ? <EmptyState text="Loading..." /> :
         (!data || data.shared_player_count === 0) ? <EmptyState text="No players mentioned by 2+ podcasts yet this week" /> :
        <div>
          <div style={{padding: "10px 12px", fontSize: 12, color: "#9099a8"}}>
            Of {data.shared_player_count} players mentioned by 2+ podcasts this week, here's who covered them first:
          </div>
          <table>
            <thead><tr><th>Podcast</th><th>Times First</th></tr></thead>
            <tbody>
              {data.first_to_cover_tally.map((r, i) => (
                <tr key={i}><td>{r.podcast}</td><td>{r.first_mentions}</td></tr>
              ))}
            </tbody>
          </table>
          <table style={{marginTop: 12}}>
            <thead><tr><th>Player</th><th>First Covered By</th><th>When</th></tr></thead>
            <tbody>
              {data.first_to_cover_detail.map((r, i) => (
                <tr key={i}>
                  <td>{r.full_name}</td>
                  <td>{r.podcast_name}</td>
                  <td>{new Date(r.first_mention_at).toLocaleString()}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
      </section>

      <section className="grid-full">
        <h2><span>Prediction Accuracy (mock data — not real)</span></h2>
        <table>
          <thead><tr><th>Podcast</th><th>Sample Calls Tracked</th><th>Hit Rate</th></tr></thead>
          <tbody>
            {MOCK_ACCURACY_DATA.map((r, i) => (
              <tr key={i}>
                <td>{r.podcast}</td>
                <td>{r.sample_calls}</td>
                <td>{Math.round(r.hit_rate * 100)}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>
    </div>
  );
}

function InSeasonTab() {
  const waiting = "Waiting on season data (starts Week 1)";
  return (
    <div className="grid">
      <SimpleTable endpoint="/api/injuries" title="Injuries"
        columns={[{key:"full_name",label:"Player"},{key:"team",label:"Team"},{key:"report_status",label:"Status"},{key:"practice_status",label:"Practice"}]}
        emptyText={waiting} timestampKey="fetched_at" />
      <SimpleTable endpoint="/api/hot_cold" title="Hot / Cold Meter"
        columns={[
          {key:"full_name",label:"Player"},{key:"team",label:"Team"},
          {key:"current_snap_pct",label:"Snap %"},{key:"delta",label:"Trend"},
          {key:"buzz_podcast_count",label:"Buzz",render: row => (
            <BuzzBadge podcastCount={row.buzz_podcast_count} risingCount={row.buzz_rising_count} fallingCount={row.buzz_falling_count} />
          )},
        ]}
        emptyText={waiting} />
      <SimpleTable endpoint="/api/trade_buy" title="Trade Targets — Buy Low"
        columns={[{key:"full_name",label:"Player"},{key:"preseason_adp",label:"Preseason ADP"},{key:"season_fantasy_points",label:"Season Pts"}]}
        emptyText={waiting} />
      <SimpleTable endpoint="/api/trade_sell" title="Trade Targets — Sell High"
        columns={[{key:"full_name",label:"Player"},{key:"preseason_adp",label:"Preseason ADP"},{key:"season_fantasy_points",label:"Season Pts"}]}
        emptyText={waiting} />
    </div>
  );
}

function PlayerSearch({ onSelect }) {
  const [q, setQ] = useState("");
  const [results, setResults] = useState([]);
  const [open, setOpen] = useState(false);

  React.useEffect(() => {
    if (q.trim().length < 2) { setResults([]); return; }
    const handle = setTimeout(() => {
      fetch(`/api/players/search?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(setResults)
        .catch(() => setResults([]));
    }, 200);
    return () => clearTimeout(handle);
  }, [q]);

  return (
    <div className="player-search">
      <input
        type="text"
        placeholder="Search players..."
        value={q}
        onChange={e => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && results.length > 0 && (
        <div className="player-search-dropdown">
          {results.map(p => (
            <div
              key={p.id}
              className="player-search-result"
              onMouseDown={() => { onSelect(p.id); setQ(""); setResults([]); setOpen(false); }}
            >
              <strong>{p.full_name}</strong>
              <span style={{color: "#6b7280"}}> {p.team} · {p.position}{p.adp ? ` · ADP ${p.adp}` : ""}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PlayerPanel({ playerId, onClose }) {
  const [data, loading] = useApi(playerId ? `/api/players/${playerId}` : null, [playerId]);
  if (!playerId) return null;

  return (
    <div className="player-panel-overlay" onClick={onClose}>
      <div className="player-panel" onClick={e => e.stopPropagation()}>
        <button className="player-panel-close" onClick={onClose}>✕</button>
        {loading || !data ? <EmptyState text="Loading..." /> :
         data.error ? <EmptyState text="Player not found" /> : (
        <div>
          <h2 style={{margin: "0 0 4px", fontSize: 18}}>{data.full_name}</h2>
          <div style={{color: "#9099a8", fontSize: 13, marginBottom: 10}}>
            {data.team} · {data.position}
            {data.adp && <> · ADP {data.adp} (Round {data.draft_round})</>}
            {data.auction_value && <> · ${data.auction_value} value</>}
            {data.bye_week && <> · Bye Week {data.bye_week}</>}
          </div>
          <div style={{display: "flex", alignItems: "center", gap: 10, marginBottom: 14}}>
            <BuzzBadge podcastCount={data.podcast_count} risingCount={data.rising_count} fallingCount={data.falling_count} />
            <span style={{fontSize: 12, color: "#6b7280"}}>{data.quotes.length} quote(s), all-time</span>
          </div>
          {data.quotes.length === 0 ? <EmptyState text="No podcast quotes about this player yet" /> :
          <table>
            <thead><tr><th>Quote</th><th>Tags</th><th>Source</th></tr></thead>
            <tbody>{data.quotes.map((q, i) => <NewsQuoteRow q={q} key={i} />)}</tbody>
          </table>}
        </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("draft");
  const [devOpen, setDevOpen] = useState(false);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  return (
    <React.Fragment>
      <header>
        <h1>Fantasy Football Command Center</h1>
        <span style={{display: "flex", alignItems: "center", gap: 10}}>
          <PlayerSearch onSelect={setSelectedPlayerId} />
          <span style={{color:"#6b7280", fontSize:12}}>10-Team League</span>
          <button className="dev-toggle" onClick={() => setDevOpen(o => !o)}>
            {devOpen ? "▾ Dev" : "▸ Dev"}
          </button>
        </span>
      </header>
      <PlayerPanel playerId={selectedPlayerId} onClose={() => setSelectedPlayerId(null)} />
      <DevPanel open={devOpen} />
      <LatestUpdate onSelectPlayer={setSelectedPlayerId} />
      <PipelineStatusBar />
      <div className="tabs">
        <div className={"tab " + (tab === "news" ? "active" : "")} onClick={() => setTab("news")}>Latest News</div>
        <div className={"tab " + (tab === "draft" ? "active" : "")} onClick={() => setTab("draft")}>Draft</div>
        <div className={"tab " + (tab === "salary" ? "active" : "")} onClick={() => setTab("salary")}>Salary</div>
        <div className={"tab " + (tab === "season" ? "active" : "")} onClick={() => setTab("season")}>In-Season</div>
        <div className={"tab " + (tab === "waiver" ? "active" : "")} onClick={() => setTab("waiver")}>Waiver Wire</div>
        <div className={"tab " + (tab === "trends" ? "active" : "")} onClick={() => setTab("trends")}>Trends</div>
        <div className={"tab " + (tab === "reliability" ? "active" : "")} onClick={() => setTab("reliability")}>Reliability 🧪</div>
      </div>
      <main>
        {tab === "news" ? <div className="grid"><News /></div> :
         tab === "draft" ? <DraftTab /> :
         tab === "salary" ? <SalaryTab /> :
         tab === "season" ? <InSeasonTab /> :
         tab === "waiver" ? <WaiverWireTab /> :
         tab === "trends" ? <SentimentTrendTab /> : <ReliabilityTab />}
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
